name: Clone and Run Nexuss Bash
description: "Clone the repo, run test-hello.sh, show results"

steps:
  - id: install_git
    root: true
    command: "apt-get update -qq && apt-get install -y git"
    timeout: 120

  - id: clone
    command: "git clone https://github.com/nexuss0781/Nexuss-Bash.git /workspace/Nexuss-Bash"
    depends_on: install_git

  - id: run_script
    command: "bash /workspace/Nexuss-Bash/scripts/test-hello.sh"
    depends_on: clone
    timeout: 60

  - id: show_tree
    command: "ls -la /workspace/Nexuss-Bash/"
    depends_on: clone

  - id: show_examples
    command: "cat /workspace/Nexuss-Bash/examples/hello-world.yaml"
    depends_on: clone
