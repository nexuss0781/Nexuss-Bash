name: Clone and Run Nexuss Bash
description: "Clone repo and execute scripts — one pipeline, done"

steps:
  - id: install_git
    root: true
    command: "apt-get update -qq && apt-get install -y git"
    timeout: 120

  - id: clone
    command: "git clone https://github.com/nexuss0781/Nexuss-Bash.git /workspace/Nexuss-Bash"
    depends_on: install_git

  - id: run_hello
    command: "cat /workspace/Nexuss-Bash/examples/hello-world.yaml"
    depends_on: clone

  - id: show_versions
    code: |
      import platform, sys
      print(f'Python {sys.version.split()[0]}')
      print(f'OS {platform.system()} {platform.release()}')
    depends_on: clone
